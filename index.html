
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JavaScript Diagnostic</title>
<style>
body {
  background: #101114;
  color: white;
  font-family: sans-serif;
  padding: 24px;
}
button {
  padding: 14px;
  margin-top: 12px;
}
#status {
  color: #70e0a0;
  font-weight: bold;
}
</style>
</head>
<body>

<h2>JavaScript Diagnostic</h2>
<p id="status">JavaScript: starting...</p>

<input id="iso" type="file" accept=".iso">

<p id="filename">No ISO selected</p>

<button id="test">JavaScript Test</button>

<script>
(function () {
  "use strict";

  const status = document.getElementById("status");
  const iso = document.getElementById("iso");
  const filename = document.getElementById("filename");
  const test = document.getElementById("test");

  status.textContent = "JavaScript: RUNNING";

  test.addEventListener("click", function () {
    status.textContent = "JavaScript: BUTTON WORKS";
  });

  iso.addEventListener("change", function () {
    const file = iso.files && iso.files[0];

    filename.textContent = file
      ? "Selected: " + file.name + " (" + file.size + " bytes)"
      : "No ISO selected";
  });

  window.addEventListener("error", function (event) {
    status.textContent = "ERROR: " + event.message;
  });

  window.addEventListener("unhandledrejection", function (event) {
    status.textContent = "PROMISE ERROR: " + event.reason;
  });
})();
</script>

</body>
</html>
